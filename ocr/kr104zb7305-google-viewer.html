<style>
/* Layout: toolbar on top, page scan with overlay on the left, inspector + reading order on the right */
:root {
  --bg: #eef0f1;
  --panel: #ffffff;
  --fg: #1b2226;
  --muted: #5c676d;
  --rule: #d5dadd;
  --chandra: #0e7c86;
  --chandra-fill: rgba(14,124,134,.10);
  --abbyy: #a3106a;
  --abbyy-fill: rgba(163,16,106,.10);
  /* Overlay inks sit on the tan scan in both themes, so they don't change with the theme */
  --c-ink: #00636b;
  --c-ink-fill: rgba(0,99,107,.10);
  --a-ink: #b0007a;
  --a-ink-fill: rgba(176,0,122,.10);
  --on-ink: #ffffff;
  --hit: #d6a400;
  --focus: #2457c5;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a1d; --panel: #1d2428; --fg: #e3e8ea; --muted: #97a3a9; --rule: #333d42;
  --chandra: #3fc1cc; --chandra-fill: rgba(63,193,204,.14);
  --abbyy: #f06ab4; --abbyy-fill: rgba(240,106,180,.14);
  --hit: #ffd23f; --focus: #7aa2ff; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #151a1d; --panel: #1d2428; --fg: #e3e8ea; --muted: #97a3a9; --rule: #333d42;
  --chandra: #3fc1cc; --chandra-fill: rgba(63,193,204,.14);
  --abbyy: #f06ab4; --abbyy-fill: rgba(240,106,180,.14);
  --hit: #ffd23f; --focus: #7aa2ff; color-scheme: dark }

body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
img { max-width: 100%; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1500px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
h1 { font-size: 1.15rem; font-weight: 600; margin: 0; text-wrap: balance; }
h1 .druid { font-family: var(--mono); font-weight: 500; }
header p { margin: 0; color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-right: 2px; }
button, input[type=search] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 9px; }
button { cursor: pointer; font-variant-numeric: tabular-nums; }
button:hover { border-color: var(--muted); }
button[aria-pressed="true"] { background: var(--fg); color: var(--panel); border-color: var(--fg); }
button:focus-visible, input:focus-visible, .chip input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
.pages button { min-width: 2em; padding-inline: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; padding: 2px 4px; }
.chip input { accent-color: var(--fg); margin: 0; }
.swatch { width: 12px; height: 12px; border-radius: 2px; border: 2px solid; display: inline-block; }
.sw-c { border-color: var(--chandra); background: var(--chandra-fill); }
.sw-a { border-color: var(--abbyy); background: var(--abbyy-fill); }
input[type=search] { width: 11em; }
select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 3px 6px; font-variant-numeric: tabular-nums; }
select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 400px); gap: 14px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }

.stage { position: relative; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 8px; min-width: 0; }
.scan { position: relative; max-width: 100%; margin: 0 auto; }
.scan img { display: block; width: 100%; height: auto; }
.scan svg { position: absolute; inset: 0; width: 100%; height: 100%; }
svg rect { vector-effect: non-scaling-stroke; }
.c-block { fill: var(--c-ink-fill); stroke: var(--c-ink); stroke-width: 2; }
.c-line { fill: none; stroke: var(--c-ink); stroke-width: 1.25; stroke-dasharray: 4 3; }
.c-word { fill: transparent; stroke: var(--c-ink); stroke-width: 1.25; }
.c-ill { fill: var(--c-ink-fill); stroke: var(--c-ink); stroke-width: 2; stroke-dasharray: 10 5; }
.a-block { fill: var(--a-ink-fill); stroke: var(--a-ink); stroke-width: 2; }
.a-line { fill: none; stroke: var(--a-ink); stroke-width: 1.25; stroke-dasharray: 4 3; }
.a-word { fill: transparent; stroke: var(--a-ink); stroke-width: 1.25; }
.a-ill { fill: var(--a-ink-fill); stroke: var(--a-ink); stroke-width: 2; stroke-dasharray: 10 5; }
.hoverable { pointer-events: all; cursor: crosshair; }
.hoverable:hover, .sel { stroke: var(--focus) !important; stroke-width: 2.5 !important; opacity: 1; }
.hit { fill: var(--hit) !important; fill-opacity: .45; stroke: var(--hit) !important; opacity: 1; }
.num { font: 600 44px var(--mono); fill: var(--on-ink); paint-order: stroke; }
.num-bg { fill: var(--c-ink); stroke: none; }
.num-bg.a { fill: var(--a-ink); }

aside { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.card h2 { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
.inspect-text { font-size: 1rem; margin: 0 0 8px; overflow-wrap: anywhere; }
.inspect-text.empty { color: var(--muted); font-size: .9rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0; font-size: .85rem; }
dt { color: var(--muted); }
dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.src-tag { display: inline-block; font: 500 .7rem var(--mono); text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 3px; color: var(--panel); }
.src-tag.chandra { background: var(--chandra); }
.src-tag.abbyy { background: var(--abbyy); }

.order { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 60vh; overflow-y: auto; }
.order li button { width: 100%; text-align: left; display: grid; grid-template-columns: 2.2em minmax(0,1fr); gap: 8px; background: transparent; border-color: transparent; padding: 5px 6px; }
.order li button:hover, .order li button.sel-row { background: var(--bg); border-color: var(--rule); }
.order .n { font: 500 .8rem var(--mono); color: var(--panel); background: var(--chandra); border-radius: 3px; text-align: center; align-self: start; padding: 1px 0; }
.order .n.a { background: var(--abbyy); }
.order .t { font-size: .85rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.order .meta { display: block; font: .72rem var(--mono); color: var(--muted); }
.stats { font-size: .82rem; color: var(--muted); margin: 0 0 8px; }
.note { font-size: .8rem; color: var(--muted); margin: 0; }
</style>

      const g = $(`g-${s}-${lv}`);
      if (g) g.style.pointerEvents = lv === finest ? "" : "none";
    }
  }
  renderOrder();
}

function inspect(r) {
  if (selEl) selEl.classList.remove("sel");
  selEl = r; r.classList.add("sel");
  const info = r._info;
  const t = $("i-text");
  t.textContent = info.text || "(no text)";
  t.classList.toggle("empty", !info.text);
  const [x, y, w, h] = info.box;
  const rows = [
    ["Source", `<span class="src-tag ${info.src}">${LABEL[info.src]}</span>`],
    ["Element", `${info.level} ${info.id}`],
    ["HPOS, VPOS", `${x}, ${y}`],
    ["WIDTH × HEIGHT", `${w} × ${h}`],
  ];
  if (info.lines !== undefined) rows.push(["Lines", info.lines]);
  if (info.words !== undefined) rows.push(["Words", info.words]);
  if (info.wc !== undefined && info.wc >= 0) rows.push(["Confidence (WC)", info.wc.toFixed(2)]);
  $("i-dl").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  document.querySelectorAll(".order button").forEach(b => b.classList.toggle("sel-row", b._src === info.src && b._block === r._block));
}

$("ov").addEventListener("pointerover", e => { if (e.target._info) inspect(e.target); });
$("ov").addEventListener("click", e => { if (e.target._info) inspect(e.target); });

function renderOrder() {
  const p = PAGES[cur];
  const s = $("c-block").checked || $("c-line").checked || $("c-word").checked || !($("a-block").checked || $("a-line").checked || $("a-word").checked) ? "c" : "a";
  const data = p[SRC[s]] || EMPTY;
  const lines = data.blocks.reduce((n, b) => n + (b.l || []).length, 0);
  const words = data.blocks.reduce((n, b) => n + (b.l || []).reduce((m, l) => m + l.w.length, 0), 0);
  $("order-h").textContent = `Reading order · ${s === "c" ? META.label : "ABBYY"}`;
  const other = p[SRC[s === "c" ? "a" : "c"]] || EMPTY;
  const oLines = other.blocks.reduce((n, b) => n + (b.l || []).length, 0);
  $("stats").textContent = `${data.blocks.length} blocks, ${lines} lines, ${words} words (${s === "c" ? "ABBYY" : META.label} has ${other.blocks.length} blocks, ${oLines} lines)`;
  const ol = $("order");
  ol.replaceChildren();
  data.blocks.forEach((b, bi) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn._src = SRC[s]; btn._block = bi;
    const text = b.k === "ill" ? `Illustration (${b.type})` : blockText(b).replace(/\n/g, " ");
    btn.innerHTML = `<span class="n${s === "a" ? " a" : ""}">${bi + 1}</span><span><span class="t"></span><span class="meta">${b.b.join(" ")} · ${(b.l || []).length} line${(b.l || []).length === 1 ? "" : "s"}</span></span>`;
    btn.querySelector(".t").textContent = text;
    btn.addEventListener("click", () => {
      const r = [...$(`g-${s}-block`).children][bi];
      inspect(r);
    });
    li.appendChild(btn); ol.appendChild(li);
  });
}

function applySearch() {
  const q = $("q").value.trim().toLowerCase();
  document.querySelectorAll("#ov .hit").forEach(r => r.classList.remove("hit"));
  if (!q) return;
  document.querySelectorAll("#ov rect").forEach(r => {
    if (r._word && r._word.toLowerCase().replace(/[^\p{L}\p{N}%]/gu, "").includes(q.replace(/[^\p{L}\p{N}%]/gu, ""))) r.classList.add("hit");
  });
}

["c-block", "c-line", "c-word", "a-block", "a-line", "a-word"].forEach(id => $(id).addEventListener("change", applyLayers));
$("q").addEventListener("input", applySearch);
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight" && cur < PAGES.length - 1) show(cur + 1);
  if (e.key === "ArrowLeft" && cur > 0) show(cur - 1);
});

let start = 0;
try { const v = parseInt(localStorage.getItem("alto-page-" + META.druid), 10); if (v >= 0 && v < PAGES.length) start = v; } catch (e) {}
show(start);
</script>
</body>
</html>
