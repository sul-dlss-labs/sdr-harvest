services:
  solr:
    # image: solr:10
    image: solr-rc:10.1.0-1
    ports:
      - "8983:8983"
    volumes:
      - ./solr_configs:/opt/solr/conf
      - ./solr_data:/var/solr
    environment:
      SOLR_JAVA_MEM: "-Xms256m -Xmx1024m"
      SOLR_OPTS: "-Dsolr.security.allow.urls=localhost:8983,127.0.0.1:8983"
    command:
      - solr-precreate
      - sdr-search
      - /opt/solr/conf
