[project]
name = "sdr-harvest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-text-splitters>=1.1.1",
    "pandas>=3.0.2",
    "pillow>=13.0.0",
    "pyarrow>=23.0.1",
    "pymupdf4llm>=1.28.2",
    "requests>=2.33.1",
    "tqdm>=4.67.3",
    "wordfreq>=3.1.1",
]

[project.scripts]
sdr-harvest = "sdr_harvest.cli:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["sdr_harvest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
